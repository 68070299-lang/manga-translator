<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-container">
    <header class="header">
      <div class="brand-lockup">
        <div class="brand-mark" data-testid="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="img">
            <path d="M20 5l3.3 4.3 5.4-1.1-1.1 5.3 4.4 3.2-5 2.4.5 5.6-5-2.3-4.6 3.2-.2-5.6-4.4-3.4 5-2.1L20 5z"></path>
            <path d="M15.3 18.7c1.2-1.8 2.8-2.8 4.7-2.8s3.5 1 4.7 2.8c1.1 1.7 1.1 3.8.1 5.7-1 1.8-2.8 3.3-4.8 4.6-2-1.3-3.8-2.8-4.8-4.6-1-1.9-1-4 .1-5.7z"></path>
            <path d="M17.1 20.8h.1M22.8 20.8h.1M18.3 24.4c1 .7 2.4.7 3.4 0"></path>
          </svg>
        </div>
        <div>
          <p class="brand-eyebrow">Reader controls</p>
          <h1 class="header-title">Manga Translator</h1>
        </div>
      </div>
      <button id="site-toggle-btn" class="settings-btn site-toggle-btn" title="Toggle translation on this site" aria-label="Toggle translation on this site" aria-pressed="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v14H4z"></path>
          <path d="M8 9h8"></path>
          <path d="M8 13h5"></path>
        </svg>
        <span id="site-toggle-label">On</span>
      </button>
      <button id="settings-btn" class="settings-btn" title="Open settings" aria-label="Open settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.45.14 1 0 1.45H21a2 2 0 0 1 0 4h-1.6z"></path>
        </svg>
      </button>
    </header>

    <section class="manga-strip" aria-label="Manga preview">
      <div class="strip-panel panel-warm"></div>
      <div class="strip-panel panel-ink">
        <span class="bubble bubble-one"></span>
        <span class="speedline"></span>
      </div>
      <div class="strip-panel panel-paper">
        <span class="profile-line"></span>
      </div>
      <div class="strip-panel panel-cafe">
        <span class="cup"></span>
        <span class="tiny-page"></span>
      </div>
    </section>

    <section class="section section-flat">
      <div class="field-heading">Pipeline Mode</div>
      <div class="mode-tabs" role="radiogroup" aria-label="Pipeline mode">
        <label class="mode-tab" for="mode-cloud">
          <input type="radio" name="pipeline-mode" id="mode-cloud" value="cloud">
          <span>Cloud API</span>
        </label>
        <label class="mode-tab" for="mode-local">
          <input type="radio" name="pipeline-mode" id="mode-local" value="local" checked>
          <span>Local</span>
        </label>
      </div>

      <div id="connection-indicator" class="connection-indicator" style="display: none;" aria-live="polite">
        <span class="status-dot"></span>
        <span class="status-label">Local backend</span>
      </div>
    </section>

    <section class="section warning-section" id="api-warning-section" style="display: none;" aria-live="polite">
      <p id="api-warning-text" class="warning-text">No translate API key is configured. <a href="#" id="api-warning-link">Open Settings</a></p>
    </section>

    <section class="section">
      <div class="form-group">
        <label for="target-lang">Target Language</label>
        <select id="target-lang" class="select">
          <option value="English">English</option>
          <option value="Spanish">Spanish</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Italian">Italian</option>
          <option value="Russian">Russian</option>
          <option value="Chinese">Chinese</option>
          <option value="Korean">Korean</option>
          <option value="Vietnamese">Vietnamese</option>
          <option value="Thai">Thai</option>
          <option value="Indonesian">Indonesian</option>
        </select>
      </div>
    </section>

    <section class="section">
      <div class="form-group">
        <label for="font-size">Font Size <span class="value-pill"><span id="font-size-value">16</span>px</span></label>
        <input type="range" id="font-size" class="slider" min="8" max="24" value="16">
      </div>

      <div class="form-group">
        <label for="font-family">Font Family</label>
        <select id="font-family" class="select">
          <option value="'CC Wild Words', sans-serif">CC Wild Words</option>
          <option value="sans-serif">Sans-serif</option>
          <option value="'Anime Ace', sans-serif">Anime Ace (if installed)</option>
          <option value="'Manga Temple', sans-serif">Manga Temple (if installed)</option>
          <option value="'Back Issues', sans-serif">Back Issues (if installed)</option>
          <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
        </select>
      </div>
    </section>

    <section class="section options">
      <label class="checkbox-label">
        <input type="checkbox" id="auto-translate">
        <span>Auto-translate on load</span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="show-progress" checked>
        <span>Show progress overlay</span>
      </label>
    </section>

    <section class="section status-section" id="status-section" style="display: none;" aria-live="polite">
      <div class="status-bar">
        <div class="status-text" id="status-text">Ready</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="actions">
      <button id="translate-btn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 0 1-9 9 9.6 9.6 0 0 1-6.8-2.8"></path>
          <path d="M3 12a9 9 0 0 1 9-9 9.6 9.6 0 0 1 6.8 2.8"></path>
          <path d="M21 3v6h-6"></path>
          <path d="M3 21v-6h6"></path>
        </svg>
        <span>All</span>
      </button>
      <button id="translate-visible-btn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v14H4z"></path>
          <path d="M8 9h8"></path>
          <path d="M8 13h5"></path>
        </svg>
        <span>Visible</span>
      </button>
      <button id="translate-region-btn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8V4h4"></path>
          <path d="M16 4h4v4"></path>
          <path d="M20 16v4h-4"></path>
          <path d="M8 20H4v-4"></path>
        </svg>
        <span>Region</span>
      </button>
      <button id="clear-page-btn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v5"></path>
          <path d="M14 11v5"></path>
        </svg>
        <span>Clear Page</span>
      </button>
      <button id="stop-btn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12"></rect>
        </svg>
        <span>Stop</span>
      </button>
      <button id="clear-cache-btn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v5"></path>
          <path d="M14 11v5"></path>
        </svg>
        <span>Clear Cache</span>
      </button>
    </section>

    <footer class="cache-stats" id="cache-stats">
      <span id="cache-count">0 cached</span>
    </footer>
  </main>

  <script src="../lib/settings.js"></script>
  <script src="../lib/site-activation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
