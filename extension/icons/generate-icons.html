<!DOCTYPE html>
<html>
<head>
    <title>Generate PNG Icons</title>
</head>
<body>
    <h1>Icon Generator for Manga Translator</h1>
    <p>Open this file in a browser, then right-click each image and "Save image as" to save the PNG files.</p>
    <p>Save them to the extension/icons/ folder with the correct names.</p>
    
    <h2>icon16.png</h2>
    <canvas id="icon16" width="16" height="16"></canvas>
    <br><br>
    
    <h2>icon48.png</h2>
    <canvas id="icon48" width="48" height="48"></canvas>
    <br><br>
    
    <h2>icon128.png</h2>
    <canvas id="icon128" width="128" height="128"></canvas>
    
    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Create gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#8b5cf6');
            
            // Draw rounded rectangle
            const radius = size * 0.15;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw text (翻 = "translate" in Japanese)
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.55}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('翻', size / 2, size / 2 + size * 0.05);
        }
        
        drawIcon('icon16', 16);
        drawIcon('icon48', 48);
        drawIcon('icon128', 128);
        
        // Auto-download functionality
        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Add download buttons
        document.querySelectorAll('canvas').forEach(canvas => {
            const btn = document.createElement('button');
            btn.textContent = `Download ${canvas.id}.png`;
            btn.onclick = () => downloadCanvas(canvas.id, canvas.id + '.png');
            canvas.parentNode.insertBefore(btn, canvas.nextSibling);
        });
    </script>
</body>
</html>
