[project]
name = "manga-translation-backend"
version = "0.1.0"
description = "FastAPI backend for manga image translation used by the Chrome extension."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pillow>=11.0.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "shapely>=2.1.0",
  "pyclipper>=1.3.0",
  "huggingface-hub>=0.34.0",
  "jaconv>=0.3.4",
  "aiohttp>=3.9.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "openai>=1.50.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6",
  "orjson>=3.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_backend"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12.0", "pyright>=1.1.400"]
cpu = ["onnxruntime>=1.22.0"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.22.0"]
directml = ["onnxruntime-directml>=1.22.0"]

[tool.uv]
package = true
default-groups = ["dev", "cpu"]
conflicts = [
  [{ group = "cpu" }, { group = "gpu" }],
  [{ group = "cpu" }, { group = "directml" }],
  [{ group = "gpu" }, { group = "directml" }],
]

[tool.ruff]
# The backend deliberately performs environment/bootstrap imports before model imports.

[tool.ruff.lint]
extend-ignore = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", ".."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
